name: ag tests

on:
  push:
    branches: [main]
    paths: ["sync/**", ".githooks/**", "artifacts/**", ".gitattributes", ".github/workflows/**"]
  # Every pull request starts the workflow, so `main` can require the `ag tests result` check. The `changes` job decides whether the tests run.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    # Every user's own store carries this workflow. Their Core comes from this repository, so testing it there only spends their minutes.
    if: github.repository == 'kkacprzykdev/.agents'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The push paths above already filter pushes to main. Keep this pattern in sync with them.
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --repo "${{ github.repository }}")
            grep -qE '^(sync/|\.githooks/|artifacts/|\.gitattributes$|\.github/workflows/)' <<< "$files" || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows starts processes slowly, and each test starts hundreds of git processes.
        # So its run is split by test file into ten jobs that run at the same time.
        os: [windows-latest]
        shard: [1/10, 2/10, 3/10, 4/10, 5/10, 6/10, 7/10, 8/10, 9/10, 10/10]
        include:
          - { os: ubuntu-latest, shard: 1/1 }
          - { os: macos-latest, shard: 1/1 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history, so a test can take the ag from a pinned commit before Profile migrations.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Run the ag tests
        working-directory: sync
        # node runs the suite itself, because Node ignores a --test-shard flag that npm test puts after its file list.
        run: node --test --test-shard=${{ matrix.shard }} "test/*.test.mjs"
      - name: Run a git hook from this checkout
        shell: bash
        run: |
          git config user.name "CI"
          git config user.email "ci@example.com"
          git config core.hooksPath .githooks
          echo check > hook-check.txt
          git add hook-check.txt
          git commit -q -m "Check that the pre-commit hook runs"

  result:
    # The check that `main` requires. It passes when the tests passed or did not need to run.
    name: ag tests result
    needs: [changes, test]
    if: always() && github.repository == 'kkacprzykdev/.agents'
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = true ]; then
            echo "The ag tests failed or were cancelled."
            exit 1
          fi
