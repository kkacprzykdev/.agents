name: ag tests

on:
  push:
    branches: [main]
    paths: ["sync/**", ".githooks/**", ".gitattributes", ".github/workflows/**"]
  pull_request:
    paths: ["sync/**", ".githooks/**", ".gitattributes", ".github/workflows/**"]
  workflow_dispatch:

jobs:
  test:
    # Every user's own store carries this workflow. Their Core comes from this repository, so testing it there only spends their minutes.
    if: github.repository == 'kkacprzykdev/.agents'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Run the ag tests
        working-directory: sync
        run: npm test
      - name: Run a git hook from this checkout
        shell: bash
        run: |
          git config user.name "CI"
          git config user.email "ci@example.com"
          git config core.hooksPath .githooks
          echo check > hook-check.txt
          git add hook-check.txt
          git commit -q -m "Check that the pre-commit hook runs"
