name: Idea
description: A change to ag, the docs, or the runtime mappings. Agents file this with ag issue idea.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you.
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
    validations:
      required: true
